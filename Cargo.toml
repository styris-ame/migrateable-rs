[package]
name = "migrateable"
version = "0.1.0"
edition = "2024"

[features]
default = ["hashed", "fjall"]
hashed = ["dep:hashed-type-def", "migrateable_derive/hashed"]
fjall = ["dep:fjall", "migrateable_derive/fjall"]
__lock_discover = ["migrateable_derive/__lock_discover"]

[[bin]]
name = "migrateable"
path = "src/main.rs"

[dependencies]
migrateable_derive = { path = "migrateable_derive" }
anyhow = "1"
hashed-type-def = { git = "https://github.com/styris-forks/silx-furtif", features = [
  "derive",
  "impl_bytes",
], optional = true }
typeid = "1"
fjall = { version = "3", default-features = false, optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "3"
serde_json = "1"
rmp-serde = "1"
rkyv = { version = "0.8", features = ["bytes-1", "uuid-1", "unaligned"] }
fjall = { version = "3" }
fjall_expanded = { git = "https://github.com/styris-ame/fjall-expanded" }
storekey = "0.11"

[[test]]
name = "migration"
path = "tests/migration.rs"
